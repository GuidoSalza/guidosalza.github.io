# ============================================================
# SITE
# ============================================================

locale          : "en-US"
title           : "Guido Salza"
title_separator : "-"
name            : "Guido Salza"
description     : "Guido Salza is Assistant Professor of Sociology at the University of Milan."
url             : "https://guidosalza.github.io"
baseurl         : ""
repository      : "GuidoSalza/guidosalza.github.io"


# ============================================================
# FEED
# ============================================================

# The website does not use a blog or news feed.
atom_feed:
  hide: true


# ============================================================
# STRUCTURED SOCIAL PROFILES
# ============================================================

social:
  type: "Person"
  name: "Guido Salza"
  links:
    - "https://www.unimi.it/it/ugov/person/guido-salza"
    - "https://www.linkedin.com/in/guido-salza-793882129"
    - "https://scholar.google.com/citations?user=m2Yt3AUAAAAJ"
    - "https://orcid.org/0000-0001-7793-5304"
    - "https://osf.io/ux3mf/"


# ============================================================
# AUTHOR PROFILE
# ============================================================

author:
  name          : "Guido Salza"
  avatar        : "photo_2022-08-03_10-53-56 (2).jpg"
  bio           : "Assistant Professor of Sociology"
  location      : "Milan, Italy"
  employer      : "University of Milan"
  uri           : "https://www.unimi.it/it/ugov/person/guido-salza"
  email         : "guido.salza@unimi.it"
  googlescholar : "https://scholar.google.com/citations?user=m2Yt3AUAAAAJ"
  linkedin      : "guido-salza-793882129"
  orcid         : "https://orcid.org/0000-0001-7793-5304"


# ============================================================
# FILES
# ============================================================

include:
  - _pages
  - files

exclude:
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .jekyll-cache
  - .sass-cache
  - CHANGELOG.md
  - CONTRIBUTING.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README
  - README.md
  - node_modules
  - package.json
  - tmp
  - vendor

encoding: "utf-8"


# ============================================================
# MARKDOWN
# ============================================================

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo


# ============================================================
# PAGE DEFAULTS
# ============================================================

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true


# ============================================================
# STYLING
# ============================================================

sass:
  sass_dir: _sass
  style: compressed


# ============================================================
# OUTPUT
# ============================================================

permalink: /:categories/:title/
timezone: Europe/Rome


# ============================================================
# PLUGINS
# ============================================================

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from


# ============================================================
# HTML COMPRESSION
# ============================================================

compress_html:
  clippings: all
  ignore:
    envs: development
